<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NailsArt BY MARIAG – Κλείσε ραντεβού</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2fb;--surface:#fff;--ink:#1f1b3a;--muted:#6b6786;--line:#ded8ee;--accent:#a3195b;--accent-ink:#fff;--taken:#ebe7f5;--ok:#1f7a55;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15122b;--surface:#1f1b3a;--ink:#f1eefc;--muted:#a7a2c4;--line:#37315c;--accent:#ff7ab8;--accent-ink:#2a0b1b;--taken:#2a2548;--ok:#6fd5a6;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1,h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0}
h1{font-size:2rem;line-height:1.1}h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:6px 0 0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{flex:0 0 64px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 0;text-align:center;font:inherit;cursor:pointer}
.day small{display:block;color:var(--muted)}.day b{font-size:1.2rem}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.day[aria-pressed=true] small{color:inherit}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 0;font:inherit;font-weight:600;cursor:pointer}
.slot[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot:disabled{background:var(--taken);color:var(--muted);text-decoration:line-through;cursor:not-allowed;border-color:transparent;font-weight:400}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{margin-top:20px;width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 1.05rem Figtree,sans-serif;padding:14px;cursor:pointer}
.go:disabled{opacity:.45;cursor:not-allowed}
.msg{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line)}
.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.err{border-color:var(--accent);color:var(--accent)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row small{display:block;color:var(--muted)}
.row button{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer}
.new{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:1px 8px;font-size:.8rem;margin-left:6px}
.dh{margin:22px 0 0;color:var(--muted);font-weight:600}
.demo{background:var(--accent);color:var(--accent-ink);text-align:center;padding:8px 16px;font-weight:600;font-size:.95rem}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:4px 16px 16px;margin-top:20px}
.box summary{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:700;font-size:1.05rem;padding:12px 0;cursor:pointer}
.box .go{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;margin-top:14px}.chk input{width:auto}
.row.blk b{color:var(--muted)}
</style>
</head>
<body>
<div class="demo">Δοκιμαστική έκδοση – δεν δέχεται ακόμα πραγματικά ραντεβού</div>
<main>
<h1>NailsArt BY MARIAG</h1>
<div id="app"></div>
</main>
<script>
// ===== ΡΥΘΜΙΣΕΙΣ: βάλε εδώ τα στοιχεία από το Supabase =====
const SUPABASE_URL="https://mxthoghaznkgwnuaszib.supabase.co";
const SUPABASE_KEY="sb_publishable_jkkAr7AfB4ETpQSxYYgvrQ_eXdE-0A2";
// ==========================================================
const TECH=["Απλό μανικιούρ","Ημιμόνιμο","Gel στο φυσικό νύχι","Τεχνητά νύχια (τζελ)","Acrylic","Nail art","Αφαίρεση ημιμόνιμου","Πεντικιούρ"];
const HOURS=[10,11,12,13,14,15,16,17,18];
const BLOCK="__BLOCK__";
const DN=["Κυρ","Δευ","Τρι","Τετ","Πεμ","Παρ","Σαβ"],MN=["Ιαν","Φεβ","Μαρ","Απρ","Μάι","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
const $=id=>document.getElementById(id),app=$("app");
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
async function rpc(fn,args){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null;
}
function say(t,k){const m=$("msg");m.innerHTML='<div class="msg '+k+'"></div>';m.firstChild.textContent=t}
if(location.hash==="#admin")admin();else customer();
addEventListener("hashchange",()=>location.reload());

/* ---------- Πελάτισσες ---------- */
function customer(){
  const dates=[];for(let i=0;dates.length<21;i++){const x=new Date();x.setDate(x.getDate()+i);if(x.getDay()!==0)dates.push(x)}
  let selDay=iso(dates[0]),selHour=null,taken=new Set();
  app.innerHTML=`<p class="sub">Διάλεξε μέρα και ώρα. Οι ώρες που έχουν κλειστεί φαίνονται γκρι.</p>
  <h2>Ημερομηνία</h2><div class="days" id="days"></div>
  <h2>Ώρα</h2><div class="slots" id="slots"></div>
  <h2>Τα στοιχεία σου</h2>
  <label for="name">Ονοματεπώνυμο</label><input id="name" autocomplete="name">
  <label for="phone">Τηλέφωνο</label><input id="phone" type="tel" autocomplete="tel">
  <label for="tech">Τεχνική</label><select id="tech">${TECH.map(t=>"<option>"+t+"</option>").join("")}</select>
  <button class="go" id="go" disabled>Κλείσε το ραντεβού</button><div id="msg" aria-live="polite"></div>`;
  const check=()=>$("go").disabled=!(selHour!==null&&$("name").value.trim()&&$("phone").value.trim());
  function render(){
    $("days").innerHTML="";
    dates.forEach(d=>{const b=document.createElement("button");b.className="day";b.setAttribute("aria-pressed",iso(d)===selDay);
      b.innerHTML=`<small>${DN[d.getDay()]}</small><b>${d.getDate()}</b><small>${MN[d.getMonth()]}</small>`;
      b.onclick=()=>{selDay=iso(d);selHour=null;render()};$("days").append(b)});
    $("slots").innerHTML="";const now=new Date();
    HOURS.forEach(h=>{const b=document.createElement("button");b.className="slot";
      b.textContent=String(h).padStart(2,"0")+":00";
      b.disabled=(selDay===iso(now)&&h<=now.getHours())||taken.has(selDay+"_"+h);
      b.setAttribute("aria-pressed",selHour===h);b.onclick=()=>{selHour=h;render()};$("slots").append(b)});
    check();
  }
  async function load(){try{const r=await rpc("get_taken",{from_day:iso(new Date())});taken=new Set(r.map(x=>x.day+"_"+x.hour));render()}catch(e){say("Δεν φορτώθηκαν οι διαθέσιμες ώρες. Δοκίμασε ξανά σε λίγο.","err")}}
  ["name","phone"].forEach(i=>$(i).addEventListener("input",check));
  $("go").onclick=async()=>{
    $("go").disabled=true;
    try{
      const ok=await rpc("book",{p_day:selDay,p_hour:selHour,p_name:$("name").value.trim(),p_phone:$("phone").value.trim(),p_tech:$("tech").value});
      if(ok){const[y,m,d]=selDay.split("-");say(`Το ραντεβού σου κλείστηκε: ${d}/${m} στις ${String(selHour).padStart(2,"0")}:00 – ${$("tech").value}. Σε περιμένουμε!`,"ok");$("name").value="";$("phone").value=""}
      else say("Η ώρα μόλις κλείστηκε από άλλη πελάτισσα. Διάλεξε άλλη.","err");
    }catch(e){say("Δεν ήταν δυνατή η κράτηση. Δοκίμασε ξανά.","err")}
    selHour=null;load();
  };
  render();load();setInterval(load,30000);
}

/* ---------- Διαχείριση (τεχνικός) ---------- */
function admin(){
  let pin=sessionStorage.getItem("pin")||"",seen=null;
  app.innerHTML=`<p class="sub">Ραντεβού</p><div id="tools" hidden>
  <details class="box"><summary>Προσθήκη ραντεβού</summary>
   <p class="sub">Για ραντεβού που κλείνεις από τηλέφωνο ή Instagram.</p>
   <div class="two"><div><label for="aDay">Ημερομηνία</label><input id="aDay" type="date"></div>
   <div><label for="aHour">Ώρα</label><select id="aHour">${HOURS.map(h=>`<option value="${h}">${String(h).padStart(2,"0")}:00</option>`).join("")}</select></div></div>
   <label for="aName">Όνομα πελάτισσας</label><input id="aName">
   <label for="aPhone">Τηλέφωνο (προαιρετικό)</label><input id="aPhone" type="tel">
   <label for="aTech">Τεχνική</label><select id="aTech">${TECH.map(t=>"<option>"+t+"</option>").join("")}</select>
   <button class="go" id="aGo">Προσθήκη ραντεβού</button></details>
  <details class="box"><summary>Κλείσιμο ώρας ή μέρας</summary>
   <p class="sub">Για ρεπό, διάλειμμα ή αργία. Οι πελάτισσες θα βλέπουν την ώρα πιασμένη.</p>
   <div class="two"><div><label for="bDay">Ημερομηνία</label><input id="bDay" type="date"></div>
   <div><label for="bHour">Ώρα</label><select id="bHour">${HOURS.map(h=>`<option value="${h}">${String(h).padStart(2,"0")}:00</option>`).join("")}</select></div></div>
   <label class="chk"><input id="bAll" type="checkbox"> Όλη τη μέρα</label>
   <button class="go" id="bGo">Κλείσιμο</button></details>
  </div><div id="login"><label for="pin">Κωδικός PIN</label><input id="pin" type="password" inputmode="numeric"><button class="go" id="in">Είσοδος</button></div><div id="msg"></div><div id="list"></div>`;
  const beep=()=>{try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}};
  async function load(){
    try{
      const rows=await rpc("admin_list",{pin});sessionStorage.setItem("pin",pin);$("login").hidden=true;$("tools").hidden=false;
      const ids=new Set(rows.map(r=>r.id));let fresh=new Set();
      if(seen){rows.forEach(r=>{if(!seen.has(r.id))fresh.add(r.id)});if(fresh.size)beep()}
      seen=ids;draw(rows,fresh);
    }catch(e){$("login").hidden=false;sessionStorage.removeItem("pin");say("Λάθος PIN ή πρόβλημα σύνδεσης.","err")}
  }
  function draw(rows,fresh){
    const L=$("list");L.innerHTML=rows.length?"":'<p class="sub">Δεν υπάρχουν ραντεβού ακόμα.</p>';let last="";
    rows.forEach(r=>{
      if(r.day!==last){last=r.day;const[y,m,d]=r.day.split("-"),dt=new Date(y,m-1,d);const h=document.createElement("div");h.className="dh";h.textContent=`${DN[dt.getDay()]} ${d}/${m}`;L.append(h)}
      const row=document.createElement("div");row.className="row";
      const s=document.createElement("div");
      if(r.tech===BLOCK){row.classList.add("blk");s.innerHTML="<b></b>";s.firstChild.textContent=String(r.hour).padStart(2,"0")+":00 · Κλειστό";
        const u=document.createElement("button");u.textContent="Άνοιγμα";
        u.onclick=async()=>{await rpc("admin_cancel",{pin,bid:r.id});load()};row.append(s,u);L.append(row);return}
      s.innerHTML="<b></b><small></small>";s.firstChild.textContent=String(r.hour).padStart(2,"0")+":00 · "+r.name;
      s.lastChild.textContent=r.tech;
      if(fresh.has(r.id)){const n=document.createElement("span");n.className="new";n.textContent="Νέο";s.firstChild.append(n)}
      if(r.phone){const call=document.createElement("a");call.href="tel:"+r.phone;call.textContent=r.phone;call.style.color="var(--accent)";s.lastChild.append(" · ",call)}
      const c=document.createElement("button");c.textContent="Ακύρωση";
      c.onclick=async()=>{if(confirm("Ακύρωση ραντεβού για "+r.name+";")){await rpc("admin_cancel",{pin,bid:r.id});load()}};
      row.append(s,c);L.append(row)});
  }
  $("in").onclick=()=>{pin=$("pin").value;$("msg").innerHTML="";load()};
  $("aDay").value=$("bDay").value=iso(new Date());
  $("bAll").onchange=()=>$("bHour").disabled=$("bAll").checked;
  $("aGo").onclick=async()=>{
    const name=$("aName").value.trim();if(!$("aDay").value||!name){say("Συμπλήρωσε ημερομηνία και όνομα.","err");return}
    try{const ok=await rpc("book",{p_day:$("aDay").value,p_hour:+$("aHour").value,p_name:name,p_phone:$("aPhone").value.trim(),p_tech:$("aTech").value});
      if(ok){say("Το ραντεβού προστέθηκε.","ok");$("aName").value="";$("aPhone").value="";seen=null;load()}
      else say("Αυτή η ώρα είναι ήδη πιασμένη.","err")}catch(e){say("Δεν ήταν δυνατή η προσθήκη. Δοκίμασε ξανά.","err")}
  };
  $("bGo").onclick=async()=>{
    if(!$("bDay").value){say("Διάλεξε ημερομηνία.","err");return}
    const hrs=$("bAll").checked?HOURS:[+$("bHour").value];let n=0;
    try{for(const h of hrs){if(await rpc("book",{p_day:$("bDay").value,p_hour:h,p_name:"Κλειστό",p_phone:"",p_tech:BLOCK}))n++}
      say(n?"Έκλεισαν "+n+(n===1?" ώρα.":" ώρες.")+(n<hrs.length?" Οι υπόλοιπες είχαν ήδη ραντεβού.":""):"Αυτές οι ώρες είναι ήδη πιασμένες.",n?"ok":"err");seen=null;load()}
    catch(e){say("Δεν ήταν δυνατό το κλείσιμο. Δοκίμασε ξανά.","err")}
  };
  if(pin)load();setInterval(()=>{if(pin)load()},15000);
}
</script>
</body>
</html>
